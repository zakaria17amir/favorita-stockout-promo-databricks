[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "favorita-spark"
version = "0.1.0"
description = "Favorita stock-out and promo analysis on Databricks (PySpark + Spark SQL + Plotly)"
requires-python = ">=3.11,<3.14"
# pyspark itself comes from the Databricks runtime; it is a dev dependency for local tests
dependencies = ["pandas>=2.2,<3", "numpy>=1.26", "plotly>=5.24"]

[project.optional-dependencies]
dev = ["pytest>=8", "pyspark>=3.5", "pyarrow>=17", "duckdb>=1.1"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
favorita_spark = ["sql/*/*.sql"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["tests", "scripts"]
